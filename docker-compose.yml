services:
  training-web:
    build: .
    container_name: training-web
    restart: unless-stopped
    env_file:
      - /etc/training/.env
    volumes:
      - /opt/training/web:/app:rw
    ports:
      - "8088:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - training_net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    command: uvicorn app:app --host 0.0.0.0 --port 8080 --reload

networks:
  training_net:
    name: training_net
    ipam:
      config:
        - subnet: 172.30.0.0/24