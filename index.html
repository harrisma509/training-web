<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Training Intelligence Platform</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="/static/favicon.ico" type="image/x-icon">
  <link rel="shortcut icon" href="/static/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="app-header">
  <div class="header-top">
    <div class="brand">
      <h1>Training Intelligence Platform</h1>
      <div class="subtitle">Training Tracking</div>
    </div>

    <nav class="tabs header-tabs">
      <button id="dailyTab" class="active" type="button">Daily</button>
      <button id="weeklyTab" type="button">Weekly</button>
      <button id="zonesTab" type="button">Zones</button>
      <button id="gearTab" type="button">Gear</button>
    </nav>

    <div class="header-actions">
      <div id="dailyControls" class="control-group">
        <label for="dailyLimit">Daily rows</label>
        <select id="dailyLimit">
          <option value="60" selected>60</option>
          <option value="90">90</option>
          <option value="365">365</option>
          <option value="1000">1000</option>
        </select>
        <button id="dailyRefresh" type="button">Refresh</button>
      </div>

      <div id="weeklyControls" class="control-group hidden">
        <label for="weeklyLimit">Weekly rows</label>
        <select id="weeklyLimit">
          <option value="26">26</option>
          <option value="60" selected>60</option>
          <option value="260">260</option>
        </select>
        <button id="weeklyRefresh" type="button">Refresh</button>
      </div>

      <div id="zonesControls" class="control-group hidden">
        <label for="zonesLimit">Zones rows</label>
        <select id="zonesLimit">
          <option value="26">26</option>
          <option value="60" selected>60</option>
          <option value="260">260</option>
        </select>
        <button id="zonesRefresh" type="button">Refresh</button>
      </div>

      <div id="gearControls" class="control-group hidden">
        <button id="gearRefresh" type="button">Refresh</button>
      </div>

      <div id="syncStatus" class="sync-pill sync-muted">
        <span class="sync-dot"></span>
        <span>Sync status loading...</span>
      </div>

      <button id="settingsBtn" type="button" class="button-secondary">Settings</button>
      <button id="syncNowBtn" type="button" class="sync-button">Sync Now</button>
    </div>
  </div>
</header>

<div id="settingsDrawer" class="settings-drawer hidden" aria-hidden="true">
  <div class="settings-panel">
    <div class="settings-header">
      <div>
        <div class="settings-title">Settings</div>
        <div class="settings-subtitle">Dashboard preferences</div>
      </div>
      <button id="settingsCloseBtn" type="button" class="drawer-close-button" aria-label="Close settings">×</button>
    </div>

    <div class="settings-body">
      <div class="settings-section">
        <div class="settings-label">Appearance</div>
        <div class="settings-choice-list">
          <label class="settings-choice"><input id="appearanceSystem" type="radio" name="appearance" value="system"> System</label>
          <label class="settings-choice"><input id="appearanceLight" type="radio" name="appearance" value="light"> Light</label>
          <label class="settings-choice"><input id="appearanceDark" type="radio" name="appearance" value="dark"> Dark</label>
        </div>
      </div>

      <div class="settings-section">
        <div class="settings-label">App Preferences</div>
        <div class="settings-choice-list">
          <label class="settings-choice"><input id="rememberLastTab" type="checkbox" checked> Remember last selected tab</label>
        </div>
        <div id="startupTabRow" class="settings-control-row hidden">
          <label for="startupTab">Startup tab</label>
          <select id="startupTab">
            <option value="daily">Daily</option>
            <option value="weekly">Weekly</option>
            <option value="zones">Zones</option>
            <option value="gear">Gear</option>
          </select>
        </div>

        <div class="settings-control-row">
          <label for="settingsDailyLimit">Daily rows</label>
          <select id="settingsDailyLimit">
            <option value="60">60</option>
            <option value="90">90</option>
            <option value="365">365</option>
            <option value="1000">1000</option>
          </select>
        </div>

        <div class="settings-control-row">
          <label for="settingsWeeklyLimit">Weekly rows</label>
          <select id="settingsWeeklyLimit">
            <option value="26">26</option>
            <option value="60">60</option>
            <option value="260">260</option>
          </select>
        </div>

        <div class="settings-control-row">
          <label for="settingsZonesLimit">Zones rows</label>
          <select id="settingsZonesLimit">
            <option value="26">26</option>
            <option value="60">60</option>
            <option value="260">260</option>
          </select>
        </div>

      </div>

      <div class="settings-section">
        <div class="settings-label">Gear filters</div>
        <div class="settings-choice-list">
          <label class="settings-choice"><input id="settingsHideShoes" type="checkbox"> Hide shoes</label>
          <label class="settings-choice"><input id="settingsHideRetired" type="checkbox"> Hide retired</label>
        </div>
      </div>

      <div class="settings-section">
        <div class="settings-label">System status</div>
        <div id="settingsStatusSummary" class="settings-status-summary" aria-live="polite">Loading...</div>
        <div class="settings-actions">
          <button id="refreshStatusBtn" type="button" class="button-secondary">Refresh Status</button>
          <button id="copyDiagnosticsBtn" type="button" class="button-primary">Copy Diagnostics</button>
        </div>
      </div>
    </div>
  </div>
</div>

  <main>
    <section id="dailyPane">
      <div class="table-wrap">
        <table id="dailyTable"></table>
      </div>
    </section>

    <section id="weeklyPane" class="hidden">
      <div class="table-wrap">
        <table id="weeklyTable"></table>
      </div>
    </section>

    <section id="zonesPane" class="hidden">
      <div class="table-wrap">
        <table id="zonesTable"></table>
      </div>
    </section>

    <section id="gearPane" class="hidden">
      <div class="table-wrap">
        <div class="gear-header-row">
          <div class="gear-header-main">
            <div class="gear-title">Gear</div>
            <div class="gear-subtitle">Read-only usage summary from Strava activities.</div>
          </div>
          <div class="gear-header-actions">
            <label class="gear-hide-shoes-label" for="hideShoesCheckbox">
              <input id="hideShoesCheckbox" type="checkbox" checked>
              Hide shoes
            </label>
            <label class="gear-hide-shoes-label" for="hideRetiredCheckbox">
              <input id="hideRetiredCheckbox" type="checkbox" checked>
              Hide retired
            </label>
          </div>
        </div>
        <table id="gearTable"></table>
      </div>
    </section>

    <div id="weeklyDrawer" class="weekly-drawer hidden" aria-hidden="true">
      <div class="weekly-drawer-header">
        <div class="drawer-title-row">
          <div>
            <div class="drawer-title">Weekly Commentary Editor</div>
            <div class="drawer-subtitle">Edit commentary fields for the selected week</div>
          </div>
          <button id="drawerCloseBtn" type="button" class="drawer-close-button" aria-label="Close drawer">×</button>
        </div>
        <div id="drawerContext" class="drawer-context"></div>
      </div>
      <div class="weekly-drawer-body">
        <div id="weeklyDrawerContent" class="weekly-drawer-content"></div>
        <div class="drawer-actions">
          <button id="drawerCancelBtn" type="button" class="button-secondary">Cancel</button>
          <button id="drawerSaveBtn" type="button" class="button-primary">Save</button>
        </div>
      </div>
    </div>
  </main>

<script src="/static/constants.js"></script>
<script src="/static/weekly.js"></script>
<script src="/static/zones.js"></script>
<script src="/static/gear.js"></script>
<script src="/static/sync.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
