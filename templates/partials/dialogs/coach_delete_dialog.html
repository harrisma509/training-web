<div id="coachDeleteDialog" class="coach-delete-dialog hidden" role="dialog" aria-modal="true"
    aria-labelledby="coachDeleteDialogTitle" aria-describedby="coachDeleteDialogDescription">
    <div class="coach-delete-dialog-backdrop" data-coach-delete-cancel="true"></div>
    <section class="coach-delete-dialog-panel" role="document">
        <h2 id="coachDeleteDialogTitle">Permanently delete this chat?</h2>
        <p id="coachDeleteDialogDescription">This permanently deletes the chat, its messages, and its saved response
            context. This action cannot be undone. There is no trash or restore option.</p>
        <div id="coachDeleteDialogError" class="coach-delete-dialog-error" role="alert" aria-live="polite"></div>
        <div class="coach-delete-dialog-actions">
            <button id="coachDeleteCancel" type="button" class="button-secondary">Cancel</button>
            <button id="coachDeleteConfirm" type="button" class="button-danger">Delete permanently</button>
        </div>
    </section>
</div>
