<section id="planPane" class="hidden">
    <div class="plan-shell">
        <div class="plan-toolbar" aria-label="Plan calendar navigation">
            <button id="planPreviousFour" type="button" aria-label="Show the previous four weeks">−4 weeks</button>
            <button id="planPreviousOne" type="button" aria-label="Show the previous week">−1 week</button>
            <button id="planToday" type="button" aria-label="Show the current week and next three weeks">Today</button>
            <label class="plan-date-jump" for="planDateJump">Jump to date
                <input id="planDateJump" type="date">
            </label>
            <button id="planNextOne" type="button" aria-label="Show the next week">+1 week</button>
            <button id="planNextFour" type="button" aria-label="Show the next four weeks">+4 weeks</button>
            <div class="plan-options-container">
                <button id="planOptionsOpen" type="button" class="plan-options-trigger"
                    aria-controls="planOptionsPopover" aria-expanded="false" aria-haspopup="dialog">
                    Plan Options
                </button>
                <div id="planOptionsPopover" class="plan-options-popover" role="dialog"
                    aria-labelledby="planOptionsTitle" aria-modal="false" hidden>
                    <h2 id="planOptionsTitle">Plan Options</h2>
                    <fieldset class="plan-options-visibility">
                        <legend>Visibility</legend>
                        <label for="planHidePastPlanned">
                            <span>Hide past planned</span>
                            <span class="plan-options-switch">
                                <input id="planHidePastPlanned" type="checkbox" role="switch"
                                    aria-label="Hide past planned" aria-checked="true" checked>
                                <span aria-hidden="true"></span>
                            </span>
                        </label>
                    </fieldset>
                    <button id="planOptionsReset" type="button" class="plan-options-reset">
                        Reset view defaults
                    </button>
                    <div id="planOptionsStatus" class="plan-options-status" role="status"
                        aria-live="polite" aria-atomic="true"></div>
                </div>
            </div>
            <button id="planPaletteOpen" type="button" class="plan-palette-trigger"
                aria-controls="planPalette" aria-expanded="false">
                Add plans
            </button>
            <button id="planTemplateLibraryOpen" type="button" class="plan-template-library-trigger"
                aria-controls="planTemplateLibrary" aria-expanded="false">
                <svg viewBox="0 0 20 20" aria-hidden="true" focusable="false">
                    <path d="M4 5.5h12M4 10h12M4 14.5h12"></path>
                </svg>
                <span>Template Library</span>
            </button>
        </div>
        <div class="plan-workspace">
            <div class="plan-calendar-region">
                <div id="planPalettePlacement" class="plan-palette-placement" aria-live="polite"></div>
                <div id="planStrip" class="plan-weeks" aria-live="polite"></div>
            </div>
            <aside id="planPalette" class="plan-palette" aria-labelledby="planPaletteTitle" hidden>
                <div class="plan-palette-header">
                    <div>
                        <h2 id="planPaletteTitle">Add plans</h2>
                        <p>Select a template, then choose a future day.</p>
                    </div>
                    <button id="planPaletteClose" type="button" class="drawer-close-button"
                        aria-label="Close Add plans">×</button>
                </div>
                <div class="plan-palette-body">
                    <section class="plan-palette-section" aria-labelledby="planPaletteQuickPicksTitle">
                        <h3 id="planPaletteQuickPicksTitle">Quick Picks</h3>
                        <div id="planPaletteQuickRows" class="plan-palette-rows" role="list"></div>
                        <div id="planPaletteQuickEmpty" class="plan-palette-state" hidden>
                            No Quick Picks yet. Use Manage Templates to add one.
                        </div>
                    </section>
                    <p id="planPaletteDragInstructions" class="sr-only">
                        Select a template with Enter or Space, or drag a row to a future Plan date.
                    </p>
                    <section class="plan-palette-section" aria-labelledby="planPaletteAllTemplatesToggle">
                        <button id="planPaletteAllTemplatesToggle" type="button"
                            class="plan-palette-section-toggle" aria-expanded="false"
                            aria-controls="planPaletteAllTemplates">
                            <span>All Templates</span>
                            <span aria-hidden="true">+</span>
                        </button>
                        <div id="planPaletteAllTemplates" hidden>
                            <div class="plan-palette-controls">
                        <label for="planPaletteSearch">Search templates</label>
                        <input id="planPaletteSearch" type="search" placeholder="Search templates"
                            autocomplete="off">
                        <label for="planPaletteCategory">Category</label>
                        <select id="planPaletteCategory">
                            <option value="">All categories</option>
                        </select>
                            </div>
                            <div id="planPaletteRows" class="plan-palette-rows" role="list"></div>
                        </div>
                    </section>
                    <div id="planPaletteStatus" class="plan-palette-status" role="status" aria-live="polite"></div>
                    <button id="planPaletteManage" type="button" class="button-secondary plan-palette-manage">
                        Manage templates
                    </button>
                </div>
            </aside>
            <aside id="planItemEditor" class="plan-item-editor" aria-label="Planned item editor" hidden></aside>
        </div>
    </div>
</section>

<div id="planTemplateLibrary" class="plan-template-library hidden" role="dialog" aria-modal="true"
    aria-labelledby="planTemplateLibraryTitle" aria-hidden="true">
    <div class="plan-template-library-backdrop" data-plan-template-action="backdrop"></div>
    <section class="plan-template-library-panel" role="document">
        <h2 id="planTemplateLibraryTitle" class="plan-template-library-a11y-title">Template Library</h2>
        <div id="planTemplateLibraryContent" class="plan-template-library-content"></div>
    </section>
</div>
