<section id="servicePane" class="hidden" aria-label="Service">
    <div class="service-subnav" role="tablist" aria-label="Service views">
        <button id="componentsSubtab" class="service-subtab active" type="button" role="tab" aria-selected="true"
            aria-controls="componentsPane" tabindex="0">Components</button>
        <button id="gearSubtab" class="service-subtab" type="button" role="tab" aria-selected="false"
            aria-controls="gearPane" tabindex="-1">Gear</button>
    </div>

    <section id="gearPane" class="hidden" role="tabpanel" aria-labelledby="gearSubtab" tabindex="0">
        <div class="table-wrap">
            <div class="gear-header-row">
                <div class="gear-header-main">
                    <div class="gear-title">Gear</div>
                    <div class="gear-subtitle">Read-only usage summary from Strava activities.</div>
                </div>
                <div class="gear-header-actions">
                    <label class="gear-hide-shoes-label" for="hideShoesCheckbox">
                        <input id="hideShoesCheckbox" type="checkbox" checked>
                        Hide shoes
                    </label>
                    <label class="gear-hide-shoes-label" for="hideRetiredCheckbox">
                        <input id="hideRetiredCheckbox" type="checkbox" checked>
                        Hide retired
                    </label>
                </div>
            </div>
            <table id="gearTable"></table>
        </div>
    </section>

    <section id="componentsPane" role="tabpanel" aria-labelledby="componentsSubtab" tabindex="0">
        <div class="table-wrap">
            <div class="gear-header-row">
                <div class="gear-header-main">
                    <div class="gear-title">Components</div>
                    <div class="gear-subtitle">Track component configuration and service recency by bike.</div>
                </div>
                <div class="components-toolbar">
                    <div id="componentsControls" class="control-group hidden">
                        <label for="componentsBikeSelect">Bike</label>
                        <select id="componentsBikeSelect"></select>
                    </div>
                    <div id="componentsSummary" class="components-summary"></div>
                    <button id="componentsAddButton" type="button" class="button-secondary">Add Component</button>
                </div>
            </div>
            <div id="componentsTableWrap" class="components-table-wrap">
                <table id="componentsTable"></table>
            </div>
        </div>
    </section>
</section>
